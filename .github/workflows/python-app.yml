name: Build and Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g., v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install PyInstaller
        run: pip install pyinstaller
      
      - name: Get version
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            VERSION="${{ github.event.inputs.tag_name }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          VERSION_NUM=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_num=$VERSION_NUM" >> $GITHUB_OUTPUT
      
      - name: Update version in main.py
        shell: pwsh
        run: |
          $VERSION_NUM = "${{ steps.get_version.outputs.version_num }}"
          $FILE = "main.py"
          if (Test-Path $FILE) {
            $content = Get-Content $FILE -Raw
            $content = $content -replace 'VERSION = ".*"', "VERSION = `"$VERSION_NUM`""
            Set-Content $FILE -Value $content -NoNewline
            Write-Host "Updated version to $VERSION_NUM"
          }
      
      - name: Build with PyInstaller
        shell: pwsh
        run: |
          $VERSION_NUM = "${{ steps.get_version.outputs.version_num }}"
          $FOLDER_NAME = "autoCompression-$VERSION_NUM"
          $ZIP_NAME = "autoCompression-$VERSION_NUM.zip"
          
          pyinstaller --onefile --name "autoCompression" --add-data "7z;7z" --console main.py
          
          New-Item -ItemType Directory -Force -Path $FOLDER_NAME
          Copy-Item "dist\autoCompression.exe" -Destination "$FOLDER_NAME\"
          
          if (Test-Path "7z") {
            Copy-Item -Path "7z\*" -Destination "$FOLDER_NAME\7z\" -Recurse -Force
          }
          
          Compress-Archive -Path "$FOLDER_NAME\*" -DestinationPath $ZIP_NAME -Force
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: autoCompression-${{ steps.get_version.outputs.version_num }}
          path: autoCompression-${{ steps.get_version.outputs.version_num }}.zip
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          files: autoCompression-${{ steps.get_version.outputs.version_num }}.zip
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
